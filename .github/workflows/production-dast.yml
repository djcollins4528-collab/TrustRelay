name: Production DAST

on:
  push:
    branches: [production-security-scan]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-zap:
    name: OWASP ZAP production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify production is reachable
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/health --write-out '%{http_code}' --max-time 10 https://trustrelay-production.onrender.com/healthz)"
          test "$code" = "200"
          grep -q '"status":"ok"' /tmp/health

      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: https://trustrelay-production.onrender.com
          allow_issue_writing: false
          fail_action: true
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zap-production
          cmd_options: '-a'
