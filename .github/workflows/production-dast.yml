name: Production DAST

on:
  push:
    branches: [production-security-scan]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: ${{ vars.TRUSTRELAY_PRODUCTION_SCAN_URL || 'https://trustrelay-production.onrender.com' }}

jobs:
  production-zap:
    name: OWASP ZAP production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify production application is actually reachable
        shell: bash
        run: |
          set -euo pipefail

          # Render Free services can cold-start. Retry for a bounded window, but
          # still fail closed if the real application never becomes reachable.
          health_code="000"
          for attempt in {1..12}; do
            health_code="$(curl --silent --show-error --output /tmp/health --write-out '%{http_code}' --max-time 12 "$TARGET/healthz" || true)"
            if [ "$health_code" = "200" ]; then break; fi
            echo "Health probe attempt $attempt/12 returned $health_code; retrying."
            sleep 5
          done
          test "$health_code" = "200"
          grep -q '"status":"ok"' /tmp/health

          root_code="000"
          for attempt in {1..4}; do
            root_code="$(curl --silent --show-error --location --output /tmp/root --write-out '%{http_code}' --max-time 12 "$TARGET/" || true)"
            if [ "$root_code" = "200" ]; then break; fi
            echo "Root probe attempt $attempt/4 returned $root_code; retrying."
            sleep 3
          done
          if [ "$root_code" != "200" ]; then
            echo "Refusing to report a clean DAST result: application root returned HTTP $root_code"
            cat /tmp/root || true
            exit 1
          fi

          if grep -qE 'HOST_NOT_ALLOWED|EDGE_ORIGIN_REQUIRED|RUNTIME_QUARANTINED' /tmp/root; then
            echo "Refusing to scan a security-block response instead of the application."
            exit 1
          fi

      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ env.TARGET }}
          allow_issue_writing: false
          fail_action: true
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zap-production
          cmd_options: '-a'
