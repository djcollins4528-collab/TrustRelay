name: External DAST

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-zap:
    name: OWASP ZAP staging baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for exact staging SHA
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          last_code="000"
          last_body=""
          for i in {1..20}; do
            last_code="$(curl --silent --show-error --max-time 5 --output /tmp/staging-version --write-out '%{http_code}' https://trustrelay-staging.onrender.com/version || true)"
            last_body="$(head -c 1024 /tmp/staging-version 2>/dev/null || true)"
            if [ "$last_code" = "200" ] && printf '%s' "$last_body" | grep -Fq "\"commit\":\"$GITHUB_SHA\""; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "Staging never reached exact commit $GITHUB_SHA"
            echo "Final HTTP status: $last_code"
            printf 'Final bounded response: %s\n' "$last_body"
            exit 1
          fi

      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: https://trustrelay-staging.onrender.com
          allow_issue_writing: false
          fail_action: true
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zap-staging
          cmd_options: '-a'
