name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Syntax check
        run: node --check server.mjs

      - name: Scan tracked files for live secret material
        shell: python
        run: |
          import pathlib, re, subprocess, sys

          patterns = [
              re.compile(rb"sb_secret_[A-Za-z0-9_-]{20,}"),
              re.compile(rb"sk_live_[A-Za-z0-9]{20,}"),
              re.compile(rb"whsec_[A-Za-z0-9]{20,}"),
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          ]
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          bad = []
          for raw in files:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              for pattern in patterns:
                  if pattern.search(data):
                      bad.append(str(path))
                      break
          if bad:
              print("Potential live secret material found in tracked files:")
              print("\n".join(sorted(set(bad))))
              sys.exit(1)

      - name: Verify production static-surface isolation
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://msfrbsnihylfynrtdgxe.supabase.co"
          export SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_only"
          export TRUSTRELAY_ENVIRONMENT="production"
          export TRUSTRELAY_RATE_LIMIT_PER_MINUTE="120"
          export TRUSTRELAY_ALLOWED_HOSTS="127.0.0.1"
          export TRUSTRELAY_TURNSTILE_SITE_KEY="ci-test-site-key"
          export NODE_ENV="production"
          export RENDER="true"
          export RENDER_GIT_REPO_SLUG="djcollins4528-collab/TrustRelay"
          export RENDER_GIT_BRANCH="main"
          export RENDER_GIT_COMMIT="$GITHUB_SHA"
          export RENDER_SERVICE_ID="srv-davrsuk9v7es738v9q7g"
          export RENDER_EXTERNAL_HOSTNAME="trustrelay-production.onrender.com"
          export TRUSTRELAY_APPROVED_COMMIT_SHA="$GITHUB_SHA"
          export PORT="18080"
          node server.mjs >/tmp/trustrelay-ci.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18080/healthz >/tmp/health.json; then
              break
            fi
            sleep 0.25
          done

          test "$(cat /tmp/health.json)" = '{"status":"ok"}'

          assert_status() {
            local expected="$1"
            local url="$2"
            local got
            got="$(curl --silent --output /tmp/body --write-out '%{http_code}' "$url")"
            if [ "$got" != "$expected" ]; then
              echo "Expected HTTP $expected for $url, got $got"
              cat /tmp/body || true
              exit 1
            fi
          }

          assert_status 404 http://127.0.0.1:18080/version
          assert_status 404 http://127.0.0.1:18080/server.mjs
          assert_status 404 http://127.0.0.1:18080/render.yaml
          assert_status 404 http://127.0.0.1:18080/docs/V1.0-RELEASE-GATE-FINAL.md
          assert_status 404 http://127.0.0.1:18080/supabase/migrations/0034_v10_private_function_acl_hardening.sql
          assert_status 404 http://127.0.0.1:18080/reviewer/
          assert_status 200 http://127.0.0.1:18080/
          assert_status 200 http://127.0.0.1:18080/web/
          post_health="$(curl --silent --request POST --output /tmp/body --write-out '%{http_code}' http://127.0.0.1:18080/healthz)"
          test "$post_health" = "405"
          post_config="$(curl --silent --request POST --output /tmp/body --write-out '%{http_code}' http://127.0.0.1:18080/runtime-config.json)"
          test "$post_config" = "405"

          browser_api="$(curl --silent --output /tmp/body --write-out '%{http_code}' -H 'Origin: https://attacker.invalid' -H 'X-TrustRelay-Key: tr_test' http://127.0.0.1:18080/v1/decisions/test)"
          test "$browser_api" = "403"

          wrong_type="$(curl --silent --request POST --output /tmp/body --write-out '%{http_code}' -H 'Content-Type: text/plain' -H 'X-TrustRelay-Key: tr_test' --data '{}' http://127.0.0.1:18080/v1/decisions/evaluate)"
          test "$wrong_type" = "415"

          get_body="$(curl --silent --request GET --output /tmp/body --write-out '%{http_code}' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:18080/healthz)"
          test "$get_body" = "400"

          duplicate_auth="$(curl --silent --output /tmp/body --write-out '%{http_code}' -H 'Authorization: Bearer one' -H 'Authorization: Bearer two' http://127.0.0.1:18080/)"
          test "$duplicate_auth" = "400"

          sensitive_headers="$(curl --silent --head http://127.0.0.1:18080/web/app.js | tr -d '\r')"
          printf '%s\n' "$sensitive_headers" | grep -qi '^cache-control: no-store'
          printf '%s\n' "$sensitive_headers" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive'

          bad_host="$(curl --silent --output /tmp/body --write-out '%{http_code}' -H 'Host: attacker.invalid' http://127.0.0.1:18080/)"
          test "$bad_host" = "421"

          headers="$(curl --silent --head http://127.0.0.1:18080/ | tr -d '\r')"
          printf '%s\n' "$headers" | grep -qi "^content-security-policy:.*style-src 'self'"
          printf '%s\n' "$headers" | grep -qi "style-src-attr 'none'"
          if printf '%s\n' "$headers" | grep -qi "unsafe-inline"; then
            echo "CSP unexpectedly permits unsafe-inline"
            exit 1
          fi
          printf '%s\n' "$headers" | grep -qi "^x-content-type-options: nosniff"
          printf '%s\n' "$headers" | grep -qi "^x-frame-options: DENY"
          printf '%s\n' "$headers" | grep -qi "^strict-transport-security: max-age=63072000; includeSubDomains; preload"
          grep -q 'maxHeaderSize:8192' server.mjs
          grep -q 'requireHostHeader:true' server.mjs
          grep -q 'insecureHTTPParser:false' server.mjs
          grep -q 'server.maxHeadersCount=64' server.mjs
          grep -q 'HPE_HEADER_OVERFLOW' server.mjs
          printf '%s\n' "$headers" | grep -qi "^referrer-policy: no-referrer"
          printf '%s\n' "$headers" | grep -qi "^permissions-policy:.*payment=()"
          printf '%s\n' "$headers" | grep -qi "^content-security-policy:.*base-uri 'none'"
          grep -q 'AMBIGUOUS_REQUEST_BODY' server.mjs
          grep -q 'server.maxRequestsPerSocket=50' server.mjs
          grep -q 'INVALID_REQUEST_TARGET' server.mjs
          grep -q 'DUPLICATE_CRITICAL_HEADER' server.mjs
          grep -q 'UNEXPECTED_REQUEST_BODY' server.mjs
          grep -q 'BROWSER_PARTNER_API_FORBIDDEN' server.mjs
          grep -q 'JSON_CONTENT_TYPE_REQUIRED' server.mjs
          grep -q 'authenticatedSurface?' server.mjs

      - name: Verify optional edge-origin lock
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://msfrbsnihylfynrtdgxe.supabase.co"
          export SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_only"
          export TRUSTRELAY_ENVIRONMENT="staging"
          export TRUSTRELAY_ALLOWED_HOSTS="127.0.0.1"
          export TRUSTRELAY_EDGE_ORIGIN_SECRET="ci-origin-secret-0123456789abcdef0123456789abcdef"
          export PORT="18083"
          node server.mjs >/tmp/trustrelay-origin-lock.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18083/healthz >/tmp/origin-health.json; then break; fi
            sleep 0.25
          done
          test "$(cat /tmp/origin-health.json)" = '{"status":"ok"}'

          blocked="$(curl --silent --output /tmp/origin-blocked --write-out '%{http_code}' http://127.0.0.1:18083/)"
          test "$blocked" = "403"
          grep -q 'EDGE_ORIGIN_REQUIRED' /tmp/origin-blocked

          allowed="$(curl --silent --output /tmp/origin-allowed --write-out '%{http_code}' -H 'x-trustrelay-edge-origin: ci-origin-secret-0123456789abcdef0123456789abcdef' http://127.0.0.1:18083/)"
          test "$allowed" = "200"

          grep -q 'TRUSTRELAY_EDGE_ORIGIN_SECRET_WEAK' server.mjs
          grep -q 'x-trustrelay-edge-origin' server.mjs

      - name: Verify unapproved production commit is rejected
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://msfrbsnihylfynrtdgxe.supabase.co"
          export SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_only"
          export TRUSTRELAY_ENVIRONMENT="production"
          export TRUSTRELAY_ALLOWED_HOSTS="127.0.0.1"
          export TRUSTRELAY_TURNSTILE_SITE_KEY="ci-test-site-key"
          export NODE_ENV="production"
          export RENDER="true"
          export RENDER_GIT_REPO_SLUG="djcollins4528-collab/TrustRelay"
          export RENDER_GIT_BRANCH="main"
          export RENDER_GIT_COMMIT="$GITHUB_SHA"
          export RENDER_SERVICE_ID="srv-davrsuk9v7es738v9q7g"
          export RENDER_EXTERNAL_HOSTNAME="trustrelay-production.onrender.com"
          export TRUSTRELAY_APPROVED_COMMIT_SHA="0000000000000000000000000000000000000000"
          export PORT="18081"

          if node server.mjs >/tmp/trustrelay-unapproved.log 2>&1; then
            echo "Production runtime unexpectedly accepted an unapproved commit."
            exit 1
          fi
          grep -q "UNAPPROVED_COMMIT" /tmp/trustrelay-unapproved.log

      - name: Reject inline browser code and style
        shell: python
        run: |
          import pathlib, re, sys

          roots = [pathlib.Path("index.html"), pathlib.Path("web"), pathlib.Path("verifier"), pathlib.Path("reviewer"), pathlib.Path("legal"), pathlib.Path("pilot"), pathlib.Path("support")]
          html_files = []
          js_files = []
          for root in roots:
              if root.is_file():
                  html_files.append(root)
              elif root.exists():
                  html_files.extend(root.rglob("*.html"))
                  js_files.extend(root.rglob("*.js"))

          failures = []
          for path in html_files:
              text = path.read_text(encoding="utf-8")
              if re.search(r"<style(?:\s|>)", text, re.I): failures.append(f"{path}: inline <style>")
              if re.search(r"\sstyle\s*=", text, re.I): failures.append(f"{path}: style attribute")
              for m in re.finditer(r"<script\b([^>]*)>", text, re.I):
                  if not re.search(r"\bsrc\s*=", m.group(1), re.I): failures.append(f"{path}: inline <script>")
          for path in js_files:
              text = path.read_text(encoding="utf-8")
              if re.search(r"\.style\.[A-Za-z_$]", text): failures.append(f"{path}: runtime inline style assignment")
              if re.search(r"\beval\s*\(|new\s+Function\s*\(", text): failures.append(f"{path}: dynamic code execution")

          if failures:
              print("Browser hardening invariant failed:")
              print("\\n".join(failures))
              sys.exit(1)

      - name: Audit workflow supply-chain policy
        shell: python
        run: |
          import pathlib, re, sys

          failures = []
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?m)^\s*pull_request_target\s*:", text):
                  failures.append(f"{path}: pull_request_target is forbidden")
              if re.search(r"(?m)^\s*workflow_run\s*:", text):
                  failures.append(f"{path}: workflow_run is forbidden")
              if re.search(r"(?mi)^\s*permissions\s*:\s*write-all\s*$", text):
                  failures.append(f"{path}: write-all permissions are forbidden")
              for m in re.finditer(r"(?m)^\s*uses:\s*([^\s#]+)", text):
                  ref = m.group(1)
                  if ref.startswith("./"):
                      continue
                  if "@" not in ref or not re.fullmatch(r"[^@\s]+@[0-9a-fA-F]{40}", ref):
                      failures.append(f"{path}: action is not pinned to a 40-char commit SHA: {ref}")
              if re.search(r"(?i)(curl|wget)[^\n|]*\|\s*(?:ba)?sh\b", text):
                  failures.append(f"{path}: pipe-to-shell download is forbidden")

          if failures:
              print("Workflow policy violations:")
              print("\n".join(failures))
              sys.exit(1)

      - name: Enforce browser dependency policy
        shell: python
        run: |
          import pathlib, re, sys

          allowed = {
              "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm",
              "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit",
          }
          failures = []
          for root in [pathlib.Path("web"), pathlib.Path("verifier"), pathlib.Path("reviewer")]:
              if not root.exists():
                  continue
              for path in root.rglob("*.js"):
                  text = path.read_text(encoding="utf-8")
                  executable_urls = []
                  executable_urls += re.findall(r'from\\s+["\\\'](https://[^"\\\']+)["\\\']', text)
                  executable_urls += re.findall(r'(?:src|href)\\s*=\\s*["\\\'](https://[^"\\\']+)["\\\']', text)
                  executable_urls += re.findall(r'\\bimport\\(\\s*["\\\'](https://[^"\\\']+)["\\\']\\s*\\)', text)
                  for url in executable_urls:
                      if url not in allowed:
                          failures.append(f"{path}: unapproved executable remote dependency {url}")
                  if re.search(r'https?://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@(?!2\.117\.2/\+esm)', text):
                      failures.append(f"{path}: Supabase browser dependency is not pinned to 2.117.2")

          if failures:
              print("Browser dependency policy violations:")
              print("\n".join(sorted(set(failures))))
              sys.exit(1)

      - name: Enforce ephemeral browser auth storage
        shell: bash
        run: |
          set -euo pipefail
          for file in web/app.js verifier/app.js reviewer/app.js; do
            grep -q 'sessionStorage' "$file"
            grep -q 'localStorage.removeItem(AUTH_STORAGE_KEY)' "$file"
            if grep -qE 'localStorage\.(getItem|setItem)' "$file"; then
              echo "$file persists application state in localStorage"
              exit 1
            fi
            grep -q 'referrerPolicy = "no-referrer"' "$file"
          done

      - name: Reject legacy Supabase key fallbacks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'SUPABASE_(SERVICE_ROLE_KEY|ANON_KEY)' supabase/functions; then
            echo "Legacy Supabase JWT key fallback found in Edge Function source."
            exit 1
          fi

      - name: Enforce institutional MFA invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ensureVerifierMfa' verifier/app.js
          grep -q 'auth.mfa.enroll' verifier/app.js
          grep -q 'auth.mfa.challenge' verifier/app.js
          grep -R -q 'MFA_ENROLLMENT_REQUIRED' supabase/migrations/*institutional_totp_mfa.sql
          grep -R -q "requiredAal','aal2" supabase/migrations/*institutional_totp_mfa.sql
          grep -R -q "interval '8 hours'" supabase/migrations/*institutional_session_ceiling_8h.sql
          grep -R -q "'maxSessionHours',8" supabase/migrations/*institutional_session_ceiling_8h.sql
          grep -R -q "interval '8 hours'" supabase/migrations/*secretless_portal_session_bridge.sql
          if grep -R -q "interval '12 hours'" supabase/migrations/*institutional_session_ceiling_8h.sql; then
            echo "Final institutional session ceiling regressed above 8 hours."
            exit 1
          fi
          grep -R -q 'trustrelay_rotate_signing_key_v12' supabase/migrations/*signing_key_rotation.sql

      - name: Verify runtime quarantine kill switch
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="https://msfrbsnihylfynrtdgxe.supabase.co"
          export SUPABASE_PUBLISHABLE_KEY="sb_publishable_ci_only"
          export TRUSTRELAY_ENVIRONMENT="staging"
          export TRUSTRELAY_ALLOWED_HOSTS="127.0.0.1"
          export TRUSTRELAY_RUNTIME_DISABLED="true"
          export PORT="18082"
          node server.mjs >/tmp/trustrelay-quarantine.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18082/healthz >/tmp/quarantine-health.json; then break; fi
            sleep 0.25
          done
          test "$(cat /tmp/quarantine-health.json)" = '{"status":"quarantined"}'
          health_code="$(curl --silent --output /tmp/quarantine-health-untrusted-host --write-out '%{http_code}' -H 'Host: render-internal-health.invalid' http://127.0.0.1:18082/healthz)"
          test "$health_code" = "200"
          test "$(cat /tmp/quarantine-health-untrusted-host)" = '{"status":"quarantined"}'
          code="$(curl --silent --output /tmp/quarantine-body --write-out '%{http_code}' http://127.0.0.1:18082/)"
          test "$code" = "503"
          grep -q 'RUNTIME_QUARANTINED' /tmp/quarantine-body

      - name: Enforce legacy static quarantine hook
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/legacy-static-quarantine.sh
          grep -q 'TRUSTRELAY_STATIC_QUARANTINE_DONE' ops/legacy-static-quarantine.sh
          grep -q 'Legacy static quarantine verified' ops/legacy-static-quarantine.sh
          if grep -q 'trap trustrelay_quarantine_legacy_static EXIT' ops/legacy-static-quarantine.sh; then
            echo "Legacy static quarantine must execute immediately, not rely on an EXIT trap."
            exit 1
          fi

      - name: Enforce unique migration versions
        shell: python
        run: |
          import collections, pathlib, re, sys
          versions = collections.defaultdict(list)
          for path in sorted(pathlib.Path("supabase/migrations").glob("*.sql")):
              match = re.match(r"^(\d+)_", path.name)
              if not match:
                  print(f"Migration filename missing numeric prefix: {path}")
                  sys.exit(1)
              versions[match.group(1)].append(str(path))
          dupes = {k:v for k,v in versions.items() if len(v) > 1}
          if dupes:
              print("Duplicate migration versions detected:")
              for version, paths in sorted(dupes.items()):
                  print(version + ": " + ", ".join(paths))
              sys.exit(1)

      - name: Enforce Edge Function auth contracts
        shell: python
        run: |
          import json, pathlib, sys

          root = pathlib.Path("supabase/functions")
          contract_path = root / "security-contract.json"
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          declared = contract.get("functions", {})
          failures = []
          jwt_disabled = set()

          for config_path in root.glob("*/function.json"):
              config = json.loads(config_path.read_text(encoding="utf-8"))
              slug = config.get("slug") or config_path.parent.name
              if config.get("verify_jwt") is False:
                  jwt_disabled.add(slug)

          declared_set = set(declared)
          if jwt_disabled != declared_set:
              for slug in sorted(jwt_disabled - declared_set):
                  failures.append(f"{slug}: verify_jwt=false without reviewed security contract")
              for slug in sorted(declared_set - jwt_disabled):
                  failures.append(f"{slug}: security contract exists but function.json is not verify_jwt=false")

          for slug, spec in declared.items():
              source = root / slug / "index.ts"
              config_path = root / slug / "function.json"
              if not source.exists():
                  failures.append(f"{slug}: missing index.ts")
                  continue
              if not config_path.exists():
                  failures.append(f"{slug}: missing function.json")
                  continue
              text = source.read_text(encoding="utf-8")
              for marker_text in spec.get("required", []):
                  if marker_text not in text:
                      failures.append(f"{slug}: missing independent-auth marker {marker_text!r}")
              if not spec.get("mode"):
                  failures.append(f"{slug}: auth mode not declared")

          if failures:
              print("Edge Function security-contract violations:")
              print("\n".join(failures))
              sys.exit(1)

      - name: Enforce one-time internal capability policy
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'x-trustrelay-internal-(sig|ts|service)' supabase/functions/trustrelay-verifier-evaluate-v07 supabase/functions/trustrelay-partner-v07; then
            echo "Reusable verifier-to-partner internal secret transport is forbidden."
            exit 1
          fi
          grep -q 'x-trustrelay-internal-capability' supabase/functions/trustrelay-verifier-evaluate-v07/index.ts
          grep -q 'trustrelay_mint_portal_capability_v12' supabase/functions/trustrelay-verifier-evaluate-v07/index.ts
          grep -q 'x-trustrelay-internal-capability' supabase/functions/trustrelay-partner-v07/index.ts
          grep -q 'trustrelay_consume_portal_capability_v12' supabase/functions/trustrelay-partner-v07/index.ts
          grep -q "interval '30 seconds'" supabase/migrations/0045_v12_one_time_internal_capabilities.sql
          grep -q 'consumed_at is null' supabase/migrations/0045_v12_one_time_internal_capabilities.sql
          grep -q 'body_sha256=p_body_sha256' supabase/migrations/0045_v12_one_time_internal_capabilities.sql
          grep -q 'force row level security' supabase/migrations/0058_v12_capability_defense_in_depth.sql
          grep -q "expires_at=created_at+interval '30 seconds'" supabase/migrations/0058_v12_capability_defense_in_depth.sql
          grep -q 'trustrelay_internal_capabilities_deny_clients_v12' supabase/migrations/0058_v12_capability_defense_in_depth.sql

      - name: Enforce pinned Supabase package imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'npm:@supabase/[^"[:space:]]+@(latest|next|beta)' supabase/functions; then
            echo "Unpinned or prerelease Supabase package import found."
            exit 1
          fi
