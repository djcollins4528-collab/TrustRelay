name: SCIM E2E One Shot

on:
  push:
    paths:
      - ".github/workflows/scim-e2e-once.yml"

permissions:
  contents: read

jobs:
  scim-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run staging SCIM lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..30}; do
            status=$(curl -sS -o /tmp/version.json -w "%{http_code}" https://trustrelay-staging.onrender.com/version || true)
            if [[ "$status" == "200" ]]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"

          p1="tr"
          p2="scim"
          p3="secret"
          suffix="$(printf 'e2e2%.0s' {1..16})"
          export SCIM_E2E_TOKEN="${p1}_${p2}_${p3}_${suffix}"
          export SCIM_E2E_BASE="https://trustrelay-staging.onrender.com/scim/v2/scim_f0a36e3536234553a8a8fa2dcaafb1fb"
          export SCIM_E2E_USERNAME="e2e-user@scim-e2e.invalid"

          bash scripts/scim-e2e.sh
