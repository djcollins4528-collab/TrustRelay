name: SCIM E2E Staging

on:
  push:
    paths:
      - ".github/workflows/scim-e2e-staging.yml"

permissions:
  contents: read

jobs:
  scim-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exercise tenant-bound SCIM lifecycle
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="tr_scim_secret_$(printf 'e2e0%.0s' {1..16})"
          BASE="https://trustrelay-staging.onrender.com/scim/v2/scim_f0a36e3536234553a8a8fa2dcaafb1fb"
          USERNAME="e2e-user@scim-e2e.invalid"

          request() {
            local method="$1" url="$2" data="${3:-}"
            local args=(-sS -o /tmp/body.json -w "%{http_code}" -X "$method"
              -H "Authorization: Bearer $TOKEN"
              -H "Accept: application/scim+json")
            if [[ -n "$data" ]]; then
              args+=(-H "Content-Type: application/scim+json" --data "$data")
            fi
            curl "${args[@]}" "$url"
          }

          echo "1/8 invalid bearer is rejected"
          bad_token="tr_scim_secret_$(printf 'bad0%.0s' {1..16})"
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}"             -H "Authorization: Bearer $bad_token"             -H "Accept: application/scim+json"             "$BASE/ServiceProviderConfig")
          test "$status" = "401"

          echo "2/8 ServiceProviderConfig"
          status=$(request GET "$BASE/ServiceProviderConfig")
          test "$status" = "200"
          jq -e '.schemas | index("urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig") != null' /tmp/body.json >/dev/null
          jq -e '.patch.supported == true and .filter.supported == true' /tmp/body.json >/dev/null

          echo "3/8 create or reactivate user"
          create_payload=$(jq -nc --arg u "$USERNAME" '{
            schemas:["urn:ietf:params:scim:schemas:core:2.0:User"],
            userName:$u,
            externalId:"trustrelay-scim-e2e",
            name:{givenName:"SCIM",familyName:"E2E"},
            displayName:"SCIM E2E User",
            title:"E2E Initial",
            active:true,
            emails:[{value:$u,type:"work",primary:true}]
          }')
          status=$(request POST "$BASE/Users" "$create_payload")
          test "$status" = "201"
          USER_ID=$(jq -r '.id' /tmp/body.json)
          test -n "$USER_ID"
          jq -e '.active == true' /tmp/body.json >/dev/null

          echo "4/8 filtered lookup"
          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" -G             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/scim+json"             --data-urlencode "filter=userName eq \"$USERNAME\""             "$BASE/Users")
          test "$status" = "200"
          jq -e --arg id "$USER_ID" '.totalResults >= 1 and any(.Resources[]; .id == $id)' /tmp/body.json >/dev/null

          echo "5/8 full update"
          put_payload=$(jq -nc --arg u "$USERNAME" '{
            schemas:["urn:ietf:params:scim:schemas:core:2.0:User"],
            userName:$u,
            externalId:"trustrelay-scim-e2e",
            name:{givenName:"SCIM",familyName:"E2E"},
            displayName:"SCIM E2E Updated",
            title:"E2E Updated",
            active:true,
            emails:[{value:$u,type:"work",primary:true}]
          }')
          status=$(request PUT "$BASE/Users/$USER_ID" "$put_payload")
          test "$status" = "200"
          jq -e '.displayName == "SCIM E2E Updated" and .title == "E2E Updated" and .active == true' /tmp/body.json >/dev/null

          echo "6/8 suspend"
          suspend_payload='{"schemas":["urn:ietf:params:scim:api:messages:2.0:PatchOp"],"Operations":[{"op":"Replace","path":"active","value":false}]}'
          status=$(request PATCH "$BASE/Users/$USER_ID" "$suspend_payload")
          test "$status" = "200"
          jq -e '.active == false' /tmp/body.json >/dev/null

          echo "7/8 reactivate"
          reactivate_payload='{"schemas":["urn:ietf:params:scim:api:messages:2.0:PatchOp"],"Operations":[{"op":"Replace","path":"active","value":true}]}'
          status=$(request PATCH "$BASE/Users/$USER_ID" "$reactivate_payload")
          test "$status" = "200"
          jq -e '.active == true' /tmp/body.json >/dev/null

          echo "8/8 deprovision"
          status=$(request DELETE "$BASE/Users/$USER_ID")
          test "$status" = "204"
          status=$(request GET "$BASE/Users/$USER_ID")
          test "$status" = "200"
          jq -e '.active == false' /tmp/body.json >/dev/null

          echo "SCIM_E2E_PASS user_id=$USER_ID"
