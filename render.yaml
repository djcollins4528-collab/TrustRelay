services:
  - type: web
    name: trustrelay-api-staging
    runtime: node
    plan: free
    region: virginia
    autoDeploy: true
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUSTRELAY_ENVIRONMENT
        value: staging
      - key: TRUSTRELAY_APP_VERSION
        value: "1.0.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: TRUSTRELAY_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: TRUSTRELAY_BODY_LIMIT_BYTES
        value: "262144"
      - key: TRUSTRELAY_REQUEST_TIMEOUT_MS
        value: "8000"
